apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.29.0
      helm:
        releaseName: loki
        values: |
          deploymentMode: SingleBinary

          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            storage:
              type: s3
              s3:
                endpoint: http://minio.infra.svc.cluster.local:9000
                region: us-east-1
                s3ForcePathStyle: true
                insecure: true
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
                admin: loki-admin
            schemaConfig:
              configs:
                - from: "2024-01-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h

          singleBinary:
            replicas: 1
            persistence:
              storageClass: local-path
              size: 10Gi
            extraEnv:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: minio-secret
                    key: MINIO_ROOT_USER
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-secret
                    key: MINIO_ROOT_PASSWORD
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                effect: NoSchedule

          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0

          gateway:
            enabled: false

          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
            hosts:
              - loki.lowjungxuan.dpdns.org
            tls:
              - hosts:
                  - loki.lowjungxuan.dpdns.org
                secretName: loki-tls
    - repoURL: https://github.com/lowjungxuan98/AirEye-Cluster
      targetRevision: main
      path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
