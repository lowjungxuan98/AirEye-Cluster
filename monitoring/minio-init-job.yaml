apiVersion: batch/v1
kind: Job
metadata:
  name: loki-minio-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mc alias set local http://minio.infra.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/loki-chunks
              mc mb --ignore-existing local/loki-ruler
              mc mb --ignore-existing local/loki-admin
