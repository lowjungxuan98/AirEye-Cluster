apiVersion: batch/v1
kind: Job
metadata:
  name: vault-auth-config
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault-bootstrap
      containers:
        - name: configure
          image: alpine/k8s:1.36.0
          envFrom:
            - secretRef:
                name: oidc-secret
          command:
            - /bin/sh
            - -ec
          args:
            - |
              ROOT_TOKEN=$(kubectl get secret -n infra vault-bootstrap-secret \
                -o jsonpath='{.data.VAULT_ROOT_TOKEN}' | base64 -d)

              ve() {
                kubectl exec -n infra vault-0 -- env VAULT_TOKEN="$ROOT_TOKEN" "$@"
              }

              until ve vault status >/dev/null 2>&1; do
                sleep 5
              done

              ve vault secrets enable -path=secret kv-v2 >/dev/null 2>&1 || true

              kubectl exec -n infra vault-0 -- sh -ec "cat > /tmp/aireye-cluster-read.hcl <<'EOF'
              path \"secret/metadata\"                { capabilities = [\"list\"] }
              path \"secret/metadata/aireye-cluster\"       { capabilities = [\"list\", \"read\"] }
              path \"secret/metadata/aireye-cluster/*\"     { capabilities = [\"list\", \"read\"] }
              path \"secret/metadata/aireye-genai-secret\" { capabilities = [\"list\", \"read\"] }
              path \"secret/metadata/grafana-secret\" { capabilities = [\"list\", \"read\"] }
              path \"secret/data/aireye-cluster\"           { capabilities = [\"read\"] }
              path \"secret/data/aireye-cluster/*\"         { capabilities = [\"read\"] }
              path \"secret/data/aireye-cluster/app\"       { capabilities = [\"create\", \"read\", \"update\"] }
              path \"secret/data/aireye-genai-secret\"  { capabilities = [\"read\"] }
              path \"secret/data/grafana-secret\"     { capabilities = [\"read\"] }
              path \"auth/oidc/role/keycloak\"        { capabilities = [\"read\"] }
              EOF
              VAULT_TOKEN='$ROOT_TOKEN' vault policy write aireye-cluster-read /tmp/aireye-cluster-read.hcl"

              ve vault auth enable kubernetes >/dev/null 2>&1 || true
              ve vault write auth/kubernetes/config \
                kubernetes_host=https://kubernetes.default.svc
              ve vault write auth/kubernetes/role/vso-aireye-cluster \
                bound_service_account_names=vault-secrets-operator \
                bound_service_account_namespaces=infra,argocd \
                policies=aireye-cluster-read \
                audience=vault \
                ttl=1h

              ve vault auth enable oidc >/dev/null 2>&1 || true
              ve vault auth tune -listing-visibility=unauth oidc
              ve vault write auth/oidc/config \
                oidc_discovery_url=https://keycloak.lowjungxuan.dpdns.org/realms/master \
                oidc_client_id="$OIDC_CLIENT_ID" \
                oidc_client_secret="$OIDC_CLIENT_SECRET" \
                default_role=keycloak
              ve vault write auth/oidc/role/keycloak \
                role_type=oidc \
                user_claim=preferred_username \
                oidc_scopes=openid,email,profile \
                allowed_redirect_uris=https://vault.lowjungxuan.dpdns.org/ui/vault/auth/oidc/oidc/callback,http://localhost:8250/oidc/callback \
                policies=default,aireye-cluster-read \
                ttl=1h

              # --- Full-access admin policy + per-user grant ---
              # The OIDC role above gives every Keycloak login the same narrow
              # read policy. To grant the provisioned admin user full access
              # WITHOUT elevating everyone, attach an `admin` policy directly to
              # that user's identity entity. Encoded here so the grant survives a
              # Vault rebuild (not just a live, ad-hoc change).
              kubectl exec -n infra vault-0 -- sh -ec "cat > /tmp/admin.hcl <<'EOF'
              path \"*\" {
                capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\", \"patch\", \"sudo\"]
              }
              EOF
              VAULT_TOKEN='$ROOT_TOKEN' vault policy write admin /tmp/admin.hcl"

              ADMIN_USER="$KC_USER_USERNAME"
              OIDC_ACCESSOR=$(ve vault read -format=json sys/auth/oidc | jq -r '.data.accessor')

              # If the user has already logged in, Vault auto-created an entity
              # holding the OIDC alias; reuse it. Otherwise create entity+alias
              # so a fresh login maps onto it. Either way -> policies=admin.
              EID=""
              for aid in $(ve vault list -format=json identity/entity-alias/id 2>/dev/null | jq -r '.data.keys[]?'); do
                match=$(ve vault read -format=json "identity/entity-alias/id/$aid" \
                  | jq -r --arg n "$ADMIN_USER" --arg a "$OIDC_ACCESSOR" \
                      'select(.data.name==$n and .data.mount_accessor==$a) | .data.canonical_id')
                if [ -n "$match" ]; then EID="$match"; break; fi
              done

              if [ -n "$EID" ]; then
                ve vault write "identity/entity/id/$EID" policies=admin
              else
                ve vault write identity/entity name="$ADMIN_USER" policies=admin
                EID=$(ve vault read -field=id "identity/entity/name/$ADMIN_USER")
                ve vault write identity/entity-alias name="$ADMIN_USER" \
                  canonical_id="$EID" mount_accessor="$OIDC_ACCESSOR"
              fi
