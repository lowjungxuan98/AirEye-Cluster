apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: litellm-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: aireye-cluster/litellm
  refreshAfter: 30s
  destination:
    name: litellm-secret
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        LITELLM_MASTER_KEY:
          text: '{{ get .Secrets "LITELLM_MASTER_KEY" }}'
        LITELLM_SALT_KEY:
          text: '{{ get .Secrets "LITELLM_SALT_KEY" }}'
        DATABASE_URL:
          text: '{{ get .Secrets "LITELLM_DATABASE_URL" }}'
        OPENAI_API_KEY:
          text: '{{ get .Secrets "OPENAI_API_KEY" }}'
        DEEPSEEK_API_KEY:
          text: '{{ get .Secrets "DEEPSEEK_API_KEY" }}'
        OPENROUTER_API_KEY:
          text: '{{ get .Secrets "OPENROUTER_API_KEY" }}'
        NVIDIA_NIM_API_KEY:
          text: '{{ get .Secrets "NVIDIA_NIM_API_KEY" }}'
        LANGFUSE_PUBLIC_KEY:
          text: '{{ get .Secrets "LANGFUSE_PUBLIC_KEY" }}'
        LANGFUSE_SECRET_KEY:
          text: '{{ get .Secrets "LANGFUSE_SECRET_KEY" }}'
        LANGFUSE_HOST:
          text: https://langfuse.lowjungxuan.dpdns.org
        LANGFUSE_OTEL_HOST:
          text: https://langfuse.lowjungxuan.dpdns.org
        PROXY_BASE_URL:
          text: https://litellm.lowjungxuan.dpdns.org
