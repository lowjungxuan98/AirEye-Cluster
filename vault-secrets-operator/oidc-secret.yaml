apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: oidc-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: aireye-cluster/oidc
  refreshAfter: 30s
  destination:
    name: oidc-secret
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: StatefulSet
      name: minio
    - kind: Deployment
      name: minio-console
    - kind: Deployment
      name: keycloak
