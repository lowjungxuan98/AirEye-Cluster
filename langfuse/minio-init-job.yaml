apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-minio-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: S3_SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mc alias set local http://minio.infra.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/langfuse

              mc admin user add local "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"
              mc admin user enable local "$S3_ACCESS_KEY_ID"

              cat > /tmp/langfuse-rw.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": ["arn:aws:s3:::langfuse", "arn:aws:s3:::langfuse/*"]
                  }
                ]
              }
              EOF
              mc admin policy create local langfuse-rw /tmp/langfuse-rw.json 2>/dev/null \
                || mc admin policy update local langfuse-rw /tmp/langfuse-rw.json
              mc admin policy attach local langfuse-rw --user "$S3_ACCESS_KEY_ID" 2>/dev/null || true
