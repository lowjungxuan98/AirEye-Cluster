apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-secret
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: aireye-cluster/langfuse
  refreshAfter: 30s
  destination:
    name: langfuse-secret
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        NEXTAUTH_SECRET:
          text: '{{ get .Secrets "LANGFUSE_NEXTAUTH_SECRET" }}'
        SALT:
          text: '{{ get .Secrets "LANGFUSE_SALT" }}'
        ENCRYPTION_KEY:
          text: '{{ get .Secrets "LANGFUSE_ENCRYPTION_KEY" }}'
        CLICKHOUSE_PASSWORD:
          text: '{{ get .Secrets "LANGFUSE_CLICKHOUSE_PASSWORD" }}'
        S3_ACCESS_KEY_ID:
          text: '{{ get .Secrets "LANGFUSE_S3_ACCESS_KEY_ID" }}'
        S3_SECRET_ACCESS_KEY:
          text: '{{ get .Secrets "LANGFUSE_S3_SECRET_ACCESS_KEY" }}'
        LANGFUSE_INIT_PROJECT_PUBLIC_KEY:
          text: '{{ get .Secrets "LANGFUSE_INIT_PROJECT_PUBLIC_KEY" }}'
        LANGFUSE_INIT_PROJECT_SECRET_KEY:
          text: '{{ get .Secrets "LANGFUSE_INIT_PROJECT_SECRET_KEY" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: langfuse-keycloak-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: aireye-cluster/oidc
  refreshAfter: 30s
  destination:
    name: langfuse-keycloak-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        AUTH_KEYCLOAK_CLIENT_ID:
          text: '{{ get .Secrets "OIDC_CLIENT_ID" }}'
        AUTH_KEYCLOAK_CLIENT_SECRET:
          text: '{{ get .Secrets "OIDC_CLIENT_SECRET" }}'
